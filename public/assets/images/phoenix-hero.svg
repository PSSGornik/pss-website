      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFF2CC"/>
    </linearGradient>
    <linearGradient id="tail" x1="100" y1="155" x2="100" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="40%" stop-color="#D4872A"/>
      <stop offset="100%" stop-color="#C0400F"/>
    </linearGradient>
    <radialGradient id="glow" cx="100" cy="100" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="100" cy="105" rx="95" ry="100" fill="url(#glow)"/>

  <!-- LEFT WING -->
  <path d="M96 86 Q68 52 32 16 Q22 8 14 14 Q28 34 46 50 Q66 70 88 84Z"
