  <path d="M100 100 Q78 78 50 48 Q38 38 28 44 Q44 58 58 70 Q76 86 96 98Z"
        fill="#FFD700" stroke="#DAA520" stroke-width="0.5" stroke-opacity="0.6"/>

  <!-- RIGHT WING -->
  <path d="M104 86 Q132 52 168 16 Q178 8 186 14 Q172 34 154 50 Q134 70 112 84Z"
        fill="url(#wing-r)" opacity="0.55" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <path d="M102 92 Q126 62 160 28 Q172 18 180 24 Q164 44 148 60 Q130 78 108 92Z"
