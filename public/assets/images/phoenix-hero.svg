  <!-- HEAD -->
  <circle cx="100" cy="58" r="10" fill="#FFF2CC"/>
  <circle cx="100" cy="58" r="6" fill="#FFD700"/>

  <!-- TAIL -->
  <path d="M100 155 Q93 178 86 200 Q84 210 88 218 Q94 205 100 190 Q106 205 112 218 Q116 210 114 200 Q107 178 100 155Z"
        fill="url(#tail)"/>
  <path d="M100 160 Q97 184 96 200 Q95.5 210 100 217 Q104.5 210 104 200 Q103 184 100 160Z"
